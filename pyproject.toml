[project]
name = "aidefender"
version = "0.4.0"
description = "AI-assisted cross-platform defender: local-first file scanner, nested archive inspection, heuristics, quarantine, and OpenAI-compatible triage for macOS, Linux and Windows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AIDefender" }]
keywords = ["antivirus", "security", "malware", "defender"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = []

[project.optional-dependencies]
full = ["psutil>=5.9", "watchdog>=3.0"]
test = ["pytest>=7"]

[project.scripts]
aidefender = "aidefender.cli:main"

[project.urls]
Repository = "https://github.com/Franzferdinan51/AIDefender.git"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aidefender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
