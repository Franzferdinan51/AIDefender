name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aidefender-cli-linux-x64
          - os: windows-latest
            artifact: aidefender-cli-windows-x64
          - os: macos-latest
            artifact: aidefender-cli-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build CLI binary
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .
          pyinstaller --noconfirm packaging/aidefender.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/aidefender
            dist/aidefender.exe

  ui:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cli_artifact: aidefender-cli-linux-x64
            ui_artifact: aidefender-ui-linux
          - os: windows-latest
            cli_artifact: aidefender-cli-windows-x64
            ui_artifact: aidefender-ui-windows
          - os: macos-latest
            cli_artifact: aidefender-cli-macos
            ui_artifact: aidefender-ui-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: ui/resources
      - name: Install UI deps
        working-directory: ui
        run: npm install
      - name: Build Electron
        working-directory: ui
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ui_artifact }}
          path: ui/release/**

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
